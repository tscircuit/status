name: Test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Validate live SVG image responses
        run: |
          bun -e 'import { checkSvgServiceHealth } from "./status-checks/check-svg-service-health"; const result = await checkSvgServiceHealth(); console.log(result); if (!result.ok) process.exit(1)'
